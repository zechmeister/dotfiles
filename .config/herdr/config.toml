onboarding = false

[keys]
prefix = "ctrl+w"
copy_mode = "prefix+y"
next_agent = "prefix+o"
next_workspace = "prefix+n"
previous_workspace = "prefix+p"
next_tab = ""
previous_tab = ""
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "down"
navigate_pane_up = "up"

[ui]
agent_panel_sort = "spaces"
sidebar_start_collapsed = true
sidebar_collapsed_mode = "compact"
mouse_capture = false

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  [
    { token = "$pr_open", fg = "#3fb950" },
    { token = "$pr_merged", fg = "#a371f7" },
    { token = "$pr_draft", fg = "#8b949e", dim = true },
    { token = "$pr_closed", fg = "#f85149" },
    "git_status",
  ],
]
